version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: pos_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: pos_db
      MYSQL_USER: posuser
      MYSQL_PASSWORD: pospassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pos_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: mysql://posuser:pospassword@db:3306/pos_db
      JWT_SECRET: change-this-in-production
      JWT_EXPIRES_IN: 7d
      PORT: 5000
      NODE_ENV: production
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pos_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
